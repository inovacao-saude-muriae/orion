services:
  orion:
    image: postgres:16
    container_name: orion_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: minhasenhalocal
      POSTGRES_DB: orion
    ports:
      - "5433:5432"
    volumes:
      - orion_data:/var/lib/postgresql/data

volumes:
  orion_data: